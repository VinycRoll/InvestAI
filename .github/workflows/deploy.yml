name: Deploy

on:
  push:
    branches: [main]
    workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Só executa quando o token Railway está configurado no repositório.
    # Sem secret configurado, o job é pulado com segurança (fail-closed).
    if: ${{ secrets.RAILWAY_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Verify CI passed before deploy
        run: |
          echo "Ran on main after CI; deploy is release-on-merge."

      - name: Install Railway CLI
        run: |
          curl -fsSL https://railway.app/install.sh | sh || true
          railway --version

      - name: Deploy backend to Railway
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          railway login --token "$RAILWAY_TOKEN"
          railway up --service investia-api