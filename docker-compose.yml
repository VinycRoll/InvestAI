services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # SQLite persistido em volume nomeado (compatível com usuário não-root:
      # volumes nomeados são graváveis automaticamente pelo container).
      DATABASE_URL: sqlite:////app/data/investia.db
    volumes:
      - investia_data:/app/data
    restart: unless-stopped
    healthcheck:
      # curl não existe na imagem; usamos urllib do próprio Python.
      test: ["CMD", "python", "-c", "import urllib.request,sys; urllib.request.urlopen('http://localhost:8000/api/health', timeout=5); sys.exit(0)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      target: frontend
    ports:
      - "8501:8501"
    environment:
      - API_URL=http://backend:8000
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      # Healthcheck simples via endpoint interno do Streamlit.
      test: ["CMD", "python", "-c", "import urllib.request,sys; urllib.request.urlopen('http://localhost:8501/_stcore/health', timeout=5); sys.exit(0)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

volumes:
  investia_data: